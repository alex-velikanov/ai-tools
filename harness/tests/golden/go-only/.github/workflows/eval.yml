on:
  schedule:
    - cron: '0 6 1 * *'              # monthly — catches model drift
  push:
    paths:
      - 'evals/review-prompt.md'     # any prompt edit
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./evals/run.sh
