name: proj

services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./.:/app
    ports:
      - "${WEB_PORT:-5173}:5173"
    # Vite defaults; change the dev command for other frameworks.
    command: ["sh", "-c", "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"]
    security_opt:
      - no-new-privileges:true
